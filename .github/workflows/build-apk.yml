name: Build Kasir GUN CELL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Kasir-GUN-CELL.apk
      - name: Publish Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Kasir GUN CELL v1.0
          draft: false
          prerelease: false
          body: Aplikasi resmi kasir SmartPOS GUN CELL. Klik file Kasir-GUN-CELL.apk di bagian Assets di bawah ini untuk mengunduh.
          files: app/build/outputs/apk/debug/Kasir-GUN-CELL.apk
